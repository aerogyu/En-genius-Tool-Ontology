[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engenius-onto"
version = "0.0.1"
description = "En-Genius 툴 온톨로지 — 툴 간 데이터 연결 도출 (오픈소스 트랙)"
requires-python = ">=3.10"
license = { text = "Proprietary (internal)" }

[project.scripts]
engenius-onto = "engenius_onto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuseki: Fuseki 서버가 떠 있어야 하는 테스트 (없으면 skip)",
]
