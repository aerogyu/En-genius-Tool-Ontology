# linkml lint 설정 — 실행: linkml lint --config schema/.linkmllint.yaml schema/engenius_tool.yaml
# (python -m engenius_onto schema 가 같은 설정으로 돌린다)
extends: recommended
rules:
  standard_naming:
    # 선택지 값(permissible value)은 원본 양식 '선택지' 시트 원문(한국어) 그대로여야 한다 —
    # 적재기가 엑셀 셀 값을 그대로 대조하고, rules.yaml 의 규칙 값도 원문이다.
    exclude_type: [permissible_value]
  canonical_prefixes:
    # eg:/egid: 는 사설 네임스페이스 (임시 — 정본은 스키마 prefixes, docs/02 4장)
    level: disabled
  recommended:
    # 양식 선택지 값은 원문 자체가 의미 — 값마다 설명을 달지 않는다
    exclude_type: [permissible_value]
