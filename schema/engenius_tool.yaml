id: http://en-genius.local/onto/
name: engenius_tool
title: En-Genius 툴 온톨로지
version: 0.1.0
description: >-
  연구소 분야별 SW 조사(SW기본정보·SW입출력)를 담아 툴 간 데이터 연결을 계산하기 위한 스키마.
  설계 기준은 docs/02_툴온톨로지_설계.md (3·4·7장). 클래스 7종: Field, Tool, ToolUsage, IOSpec,
  DataCategory, Feed(파생), SurveyLoad.
  ID 는 의미 없는 일련번호·해시(egid:TOOL-000001 등), 사람이 읽는 이름은 rdfs:label(@ko).
  언어 태그(@ko)는 LinkML 이 데이터로 표현하지 못하므로 적재기(M3)가 RDF 를 만들 때 이름
  속성(rdfs:label·skos:prefLabel·skos:altLabel)에만 붙인다 — 선택지 값은 태그 없는 문자열.
  식별자는 노드 IRI 자체다(eg:id 트리플 없음). ID 규칙은 SHACL 노드 모양이 IRI 패턴으로 검사한다.
  네임스페이스 정본은 이 파일의 prefixes (eg·egid) — 코드는 여기서 읽는다 (config.namespaces()).
  예약(미구현): WbsTask —uses_tool→ ToolUsage/Tool (지멘스 PoC 의 WBS Lv.6 연결).
license: 사내 전용 — 개발은 합성 데이터로만
annotations:
  form_source: reference/SW조사양식_EnGenius_v1.0.xlsx (원본 양식 — 사내 배포본은 헤더·선택지가 다를 수 있음)
  form_excluded_columns: >-
    SW기본정보|실무 문의처(선택)|인명 — 읽지도 저장하지도 않는다 (CLAUDE.md 절대 규칙 5);
    SW입출력|SW명(자동)|VLOOKUP 수식 열 — SW명은 SW ID 로 SW기본정보에서 찾는다

prefixes:
  linkml: https://w3id.org/linkml/
  eg: http://en-genius.local/onto/
  egid: http://en-genius.local/id/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: eg
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------------------
# 공통 슬롯
# ---------------------------------------------------------------------------
slots:
  id:
    identifier: true
    range: uriorcurie
    description: 노드 식별자. 의미 없는 일련번호 또는 결정적 해시 (docs/02 4장). 예 egid:TOOL-000001
  label:
    slot_uri: rdfs:label
    required: true
    description: 사람이 읽는 이름. RDF 에서는 @ko 언어 태그를 붙인다.
  status:
    range: EntityStatus
    ifabsent: string(활성)
    description: 수명주기 상태 — 삭제하지 않고 상태를 바꾼다 (docs/01 원칙 9). 없으면 활성.
  source_row:
    range: integer
    description: 원천 엑셀 시트의 행 번호 (조사 보완 시 원본 행을 찾기 위한 추적 정보).
  loaded_in:
    range: SurveyLoad
    description: 이 노드를 만든 적재 기록 (provenance).
  note:
    description: 비고 (원문).
  rule_version:
    description: 이 파생 노드를 만든 규칙 버전 (예 feed_v1).
  derived_from:
    slot_uri: prov:wasDerivedFrom
    range: SurveyLoad
    multivalued: true
    description: 파생의 근거가 된 적재 기록 (provenance).
  generated_at:
    slot_uri: prov:generatedAtTime
    range: datetime
    description: 파생 노드 생성 일시 (provenance).

# ---------------------------------------------------------------------------
# 클래스
# ---------------------------------------------------------------------------
classes:

  Derived:
    mixin: true
    description: 규칙으로 계산한 파생 노드의 provenance 묶음 (docs/02 8장). derived 그래프에만 있다.
    slots: [rule_version, derived_from, generated_at]
    slot_usage:
      rule_version: {required: true}
      derived_from: {required: true}
      generated_at: {required: true}

  ResearchField:
    class_uri: eg:Field
    description: >-
      연구소 분야 (조직 노드, RDF 클래스 eg:Field — docs/02 용어). SW기본정보 '담당 부서' 값에서
      만든다. 개명은 label 갱신, 통폐합·분할은 새 노드 + succeeded_by (상위 스키마 v0.2 §9).
      ID 는 레지스트리로 고정. 스키마·파이썬 이름만 ResearchField — 'Field' 는 생성되는 Pydantic
      코드에서 pydantic.Field 를 덮어써 모든 클래스가 깨진다 (M1 에서 실측).
    slots: [id, label, status]
    attributes:
      succeeded_by:
        range: ResearchField
        multivalued: true
        description: 통폐합·분할로 이 분야를 이어받은 분야.
    slot_usage:
      id: {pattern: "^egid:FLD-[0-9]{3}$"}

  Tool:
    description: >-
      제품 단위 툴 (표기 변형을 통합한 것). 예 ANSYS Fluent. 분야별 사용 기록은 ToolUsage.
      통합은 정규화 키 일치일 때만 자동, 유사도 후보는 사람이 판정 (docs/02 6.1).
    slots: [id, label, status]
    attributes:
      pref_label:
        slot_uri: skos:prefLabel
        required: true
        description: 대표 이름.
      alt_labels:
        slot_uri: skos:altLabel
        multivalued: true
        description: 조사에서 나온 변형 표기들 (CQ10).
      vendor:
        description: 제조사/개발주체 — 사용 기록들의 응답 중 다수값 (엇갈리면 검토표에 표시).
      kind:
        range: ToolKind
        description: 구분 — 사용 기록들의 응답 중 다수값.
      merged_into:
        range: Tool
        description: 사람 판정으로 다른 Tool 에 통합된 경우 그 대상 (status=통합됨과 함께).
    slot_usage:
      id: {pattern: "^egid:TOOL-[0-9]{6}$"}

  DataCategory:
    description: 데이터 분류 (SW입출력 '분류' 드롭다운 값). 연결 계산 키 ① (docs/02 7.1).
    slots: [id, label]
    slot_usage:
      id: {pattern: "^egid:CAT-[0-9]{3}$"}

  ToolUsage:
    description: >-
      분야별 SW 응답 1건 = SW기본정보 1행 = SW ID 1개. 같은 툴을 여러 분야가 적으면 여러 개.
      입출력(IOSpec)은 분야마다 다르므로 여기에 붙는다.
    slots: [id, label, source_row, loaded_in, note]
    slot_usage:
      id: {pattern: "^egid:USE-[0-9]{6}$"}
      note:
        annotations: {form_sheet: SW기본정보, form_header: "비고", form_column: AG}
    attributes:
      source_key:
        required: true
        description: SW ID 원문 (분야 약칭이 들어 있어 URI 로 쓰지 않는다 — docs/02 4장).
        annotations: {form_sheet: SW기본정보, form_header: "SW ID *", form_column: A}
      reported_tool_name:
        required: true
        description: SW명(정식) 원문. 툴 통합 정규화 키의 입력.
        annotations: {form_sheet: SW기본정보, form_header: "SW명(정식) *", form_column: B}
      usage_tool:
        range: Tool
        required: true
        description: 통합된 Tool (reported_tool_name 을 정규화해 결정).
      version:
        required: true
        description: 사용 중인 버전 전부 (원문).
        annotations: {form_sheet: SW기본정보, form_header: "버전 *", form_column: C}
      reported_vendor:
        required: true
        description: 제조사/개발주체 원문. Tool.vendor(다수값)의 입력.
        annotations: {form_sheet: SW기본정보, form_header: "제조사 / 개발주체 *", form_column: D}
      reported_kind:
        range: ToolKind
        required: true
        description: 구분 원문. Tool.kind(다수값)의 입력.
        annotations: {form_sheet: SW기본정보, form_header: "구분 *", form_column: E}
      purpose_class:
        description: 용도 대분류.
        range: PurposeClass
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "용도 대분류 *", form_column: F}
      purpose_detail:
        description: 용도 상세 원문. 예) 이차유로 1D 유동 네트워크 해석
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "용도 상세 *", form_column: G}
      phase:
        description: 이 SW 를 주로 쓰는 개발 단계 (걸치면 범위로).
        range: DevPhase
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "주 사용 단계 *", form_column: H}
      task_summary:
        description: 이 SW 로 실제 수행하는 업무 1~2문장.
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "주요 사용 업무 요약 *", form_column: I}
      usage_field:
        range: ResearchField
        required: true
        description: 담당 부서 값으로 만든 Field (문자열이 아니라 노드).
        annotations: {form_sheet: SW기본정보, form_header: "담당 부서 *", form_column: J}
      user_count:
        range: integer
        minimum_value: 0
        description: 사용 인원수 (정수 변환 성공 시).
        annotations: {form_sheet: SW기본정보, form_header: "사용 인원수", form_column: L}
      user_count_raw:
        description: 사용 인원수 원문 — 정수 변환에 실패했을 때만 보존 (경고와 함께).
      frequency:
        description: 사용 빈도 — 착수 순위 정렬 키 (docs/02 7.4).
        range: UsageFrequency
        annotations: {form_sheet: SW기본정보, form_header: "사용 빈도", form_column: M}
      license_type:
        description: 라이선스 형태.
        range: LicenseType
        annotations: {form_sheet: SW기본정보, form_header: "라이선스 형태", form_column: N}
      license_count:
        range: integer
        minimum_value: 0
        description: 보유 수량 (정수 변환 성공 시).
        annotations: {form_sheet: SW기본정보, form_header: "보유 수량", form_column: O}
      license_count_raw:
        description: 보유 수량 원문 — 정수 변환에 실패했을 때만 보존 (경고와 함께).
      license_expiry:
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        description: 만료 시기 YYYY-MM. 영구면 비움.
        annotations: {form_sheet: SW기본정보, form_header: "만료 시기", form_column: P}
      runtime_env:
        description: 실행 환경 (복수면 대표 1개 + 비고).
        range: RuntimeEnv
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "실행 환경 *", form_column: Q}
      airgap_ok:
        range: AirgapSupport
        required: true
        description: 폐쇄망 구동. '불가'가 낀 수기 구간은 착수 등급 '제외' (docs/02 7.4).
        annotations: {form_sheet: SW기본정보, form_header: "폐쇄망 구동 *", form_column: R}
      operation_mode:
        range: OperationMode
        required: true
        description: 조작 방식. 착수 등급 규칙의 입력 (docs/02 7.4).
        annotations: {form_sheet: SW기본정보, form_header: "조작 방식 *", form_column: S}
      batch_capable:
        description: 배치/스크립트 실행 — 사람이 클릭하지 않고 실행 가능한가.
        range: BatchCapability
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "배치/스크립트 실행 *", form_column: T}
      automation_if:
        range: AutomationInterface
        required: true
        description: 자동화 인터페이스 (대표 1개). 착수 등급 규칙의 입력 (docs/02 7.4).
        annotations: {form_sheet: SW기본정보, form_header: "자동화 인터페이스 *", form_column: U}
      automation_detail:
        description: 자동화 상세 — 언어·모듈·예시 — Python API, journal 파일, TCL 등.
        annotations: {form_sheet: SW기본정보, form_header: "자동화 상세", form_column: V}
      headless:
        description: 헤드리스 실행 — 화면 없이(서버에서) 실행 가능한가.
        range: HeadlessCapability
        annotations: {form_sheet: SW기본정보, form_header: "헤드리스 실행", form_column: W}
      auth_method:
        description: 인증/로그인 방식 — MCP 연결 시 인증 설계용.
        range: AuthMethod
        annotations: {form_sheet: SW기본정보, form_header: "인증/로그인 방식", form_column: X}
      output_storage:
        description: 산출물 주 저장 위치 (상세 경로는 SW입출력 시트).
        range: StorageLocation
        annotations: {form_sheet: SW기본정보, form_header: "산출물 주 저장 위치", form_column: Y}
      validation_status:
        description: 사내 검증 상태 (해석 SW 의 V&V 등).
        range: ValidationStatus
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "사내 검증 상태 *", form_column: Z}
      validation_ref:
        description: 검증 기준/문서번호 원문.
        annotations: {form_sheet: SW기본정보, form_header: "검증 기준/문서번호", form_column: AA}
      certification_use:
        description: 감항·인증 업무 사용 — 인증 근거 생산에 쓰이는가.
        range: YesNoUnknown
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "감항·인증 업무 사용 *", form_column: AB}
      automation_wish:
        description: 자동화 희망 작업 — 반복적이라 AI/에이전트가 대신하면 좋을 일.
        required: true
        annotations: {form_sheet: SW기본정보, form_header: "자동화 희망 작업 *", form_column: AC}
      pain_points:
        description: 현재 수작업·애로 구간 — 타 SW 와 데이터를 주고받을 때 수작업 구간 등.
        annotations: {form_sheet: SW기본정보, form_header: "현재 수작업·애로 구간", form_column: AD}
      priority_opinion:
        description: 우선순위 의견 — 착수 순위 정렬 키 (docs/02 7.4).
        range: Priority
        annotations: {form_sheet: SW기본정보, form_header: "우선순위 의견", form_column: AE}
      roadmap_note:
        description: 대체/업그레이드 계획 — 단종·버전업·전환 예정.
        annotations: {form_sheet: SW기본정보, form_header: "대체/업그레이드 계획", form_column: AF}
      feeds:
        range: ToolUsage
        multivalued: true
        description: >-
          (파생) 이 툴사용이 데이터를 공급하는 툴사용 — Feed 의 지름길, 경로 질의(eg:feeds+)용.
          derived 그래프에만 있다.

  IOSpec:
    description: >-
      SW입출력 1행. 한 툴사용이 받거나(입력) 내놓는(출력) 데이터 1종 — 에이전트 단계에서
      MCP 함수의 입력·출력 정의가 된다 (docs/01 원칙 6).
    slots: [id, label, source_row, loaded_in, note]
    slot_usage:
      id: {pattern: "^egid:IO-[0-9a-f]{10}$"}
      label:
        description: 데이터/산출물 명칭 (data_name 과 같게 둔다).
      note:
        description: 비고 원문. 수작업 키워드 보조 신호 (docs/02 7.3).
        annotations: {form_sheet: SW입출력, form_header: "비고", form_column: M}
    attributes:
      owner_source_key:
        required: true
        description: SW ID 원문. SW기본정보에 없으면 고아 입출력 — io_owner 없이 적재하고 경고.
        annotations: {form_sheet: SW입출력, form_header: "SW ID *", form_column: A}
      io_owner:
        range: ToolUsage
        description: 이 입출력을 가진 툴사용 (owner_source_key 로 찾은 것).
      direction:
        description: 방향 — 이 SW 가 받는 것 = 입력(소비), 내놓는 것 = 출력(생산).
        range: IODirection
        required: true
        annotations: {form_sheet: SW입출력, form_header: "방향 *", form_column: C}
      data_name:
        required: true
        description: 데이터/산출물 명칭 원문. 표기가 제각각이라 연결 키로 쓰지 않는다 (docs/01 원칙 3).
        annotations: {form_sheet: SW입출력, form_header: "데이터/산출물 명칭 *", form_column: D}
      io_category:
        range: DataCategory
        required: true
        description: 분류. 연결 계산 키 ①.
        annotations: {form_sheet: SW입출력, form_header: "분류 *", form_column: E}
      extensions_raw:
        required: true
        description: 파일 형식/확장자 원문.
        annotations: {form_sheet: SW입출력, form_header: "파일 형식/확장자 *", form_column: F}
      extensions:
        multivalued: true
        pattern: "^[a-z0-9_+\\-]+(\\.[a-z0-9_+\\-]+)*$"
        description: >-
          정규화한 확장자 목록 (소문자, 앞의 점·별표 제거, 별칭 적용 — 다중 점 확장자 tar.gz 허용).
          연결 계산 키 ② (docs/02 6.2). 매핑하지 못한 표기는 넣지 않고 extensions_raw 원문 + 경고.
      inhouse_format:
        range: boolean
        description: 확장자 원문에 '(사내)'·'사내' 표기가 있었는지.
      format_standard:
        description: 포맷 표준성.
        range: FormatStandard
        annotations: {form_sheet: SW입출력, form_header: "포맷 표준성", form_column: G}
      data_nature:
        description: 데이터 성격 — 서술형은 문서 RAG, 수치는 DB 적재 대상.
        range: DataNature
        required: true
        annotations: {form_sheet: SW입출력, form_header: "데이터 성격 *", form_column: H}
      transfer_method:
        range: TransferMethod
        required: true
        description: 전달 방법. '메일·수기 전달'이면 수기 구간 (docs/02 7.3).
        annotations: {form_sheet: SW입출력, form_header: "전달 방법 *", form_column: I}
      partner_raw:
        description: 연계 SW명 원문 — 신고된 연결.
        annotations: {form_sheet: SW입출력, form_header: "연계 SW명", form_column: J}
      partner_tools:
        range: Tool
        multivalued: true
        description: 연계 SW명 중 Tool 로 해석된 것.
      partner_unresolved:
        multivalued: true
        description: >-
          연계 SW명 중 Tool 로 해석하지 못한 이름 — 조사 누락 후보 (CQ09). 원문은 partner_raw 에
          있으므로 여기에는 툴 통합과 같은 정규화 키를 넣는다 (SPARQL 로는 정규화를 재현할 수 없어
          원문을 넣으면 표기 변형이 서로 다른 후보로 쪼개진다 — M1 검토).
      storage_path:
        description: 저장 위치/경로 원문 (공유폴더 경로, PDM 폴더명).
        annotations: {form_sheet: SW입출력, form_header: "저장 위치/경로", form_column: K}
      security_grade:
        range: SecurityGrade
        description: 보안등급 — 지금은 속성으로만 적재, 접근 통제는 M6 이후 MCP 게이트웨이 (docs/02 11장).
        annotations: {form_sheet: SW입출력, form_header: "보안등급", form_column: L}

  Feed:
    mixins: [Derived]
    description: >-
      (파생) 규칙으로 계산한 공급 연결 — 출력 명세 from_io 와 입력 명세 to_io 의 분류가 같고
      정규화 확장자가 겹칠 때 (docs/02 7.1). 매번 전체 재계산하며 derived 그래프에만 있다.
    slots: [id, label]
    slot_usage:
      id: {pattern: "^egid:FEED-[0-9a-f]{10}$"}
    attributes:
      from_io:
        range: IOSpec
        required: true
        description: 공급 측 출력 명세.
      to_io:
        range: IOSpec
        required: true
        description: 수요 측 입력 명세.
      supplier:
        description: 공급 측 툴사용 (from_io 의 io_owner).
        range: ToolUsage
        required: true
      consumer:
        description: 수요 측 툴사용 (to_io 의 io_owner).
        range: ToolUsage
        required: true
      matched_category:
        description: 양쪽이 일치한 분류.
        range: DataCategory
        required: true
      matched_extensions:
        multivalued: true
        required: true
        description: 양쪽이 겹친 정규화 확장자.
      confidence:
        range: FeedConfidence
        required: true
        description: 겹친 확장자가 전부 범용(config rules.yaml generic_extensions)이면 낮음.
      declared:
        range: boolean
        required: true
        description: 어느 한쪽의 신고(연계 SW명)와 일치하는지 (docs/02 7.2).
      transfer:
        range: TransferMethod
        multivalued: true
        description: 양쪽 명세의 전달 방법.
      manual:
        range: boolean
        required: true
        description: 수기 구간 여부 (전달 방법 기준).
      manual_basis:
        range: ManualBasis
        description: 수기 판정 근거 — 전달방법, 또는 비고 키워드만 있는 보조 신호.
      grade:
        range: StartGrade
        description: >-
          착수 등급 (docs/02 7.4) — 수기 연결(manual=true)인 Feed 에 매긴다. 변환 구간(숨은변환
          의심)은 계산된 연결이 없는 경우라 Feed 노드가 없다 — 그 등급을 둘 자리는 M4 전에 정한다
          (docs/05 미결 사항).

  SurveyLoad:
    description: >-
      적재 기록 1건 — 원천 조사 파일 1개를 한 번 적재한 것. 같은 실행(run_id)에서 여러 파일을
      적재하면 파일마다 1건. 경로는 남기지 않는다 (파일명과 sha256 만).
    slots: [id, label]
    slot_usage:
      id: {pattern: "^egid:LOAD-[0-9]{8}T[0-9]{6}-[0-9]{2}$"}
    attributes:
      run_id:
        required: true
        description: 적재 실행 ID (output/<실행ID> 와 같다).
      source_file_name:
        required: true
        pattern: "^[^/\\\\:]+$"
        description: 원천 파일명 (경로 제외 — 경로 구분자·드라이브 문자를 허용하지 않는다).
      source_sha256:
        description: 원천 파일 SHA-256 (소문자 16진수).
        required: true
        pattern: "^[0-9a-f]{64}$"
      loaded_at:
        description: 적재 일시.
        range: datetime
        required: true
      row_count:
        range: integer
        minimum_value: 0
        description: 적재한 행 수 (두 시트 합).
      excluded_row_count:
        range: integer
        minimum_value: 0
        description: 제외한 행 수 (예시 행·빈 행 등, 사유는 실행 로그).
      warning_count:
        description: 적재 중 경고 수 (내용은 실행 로그).
        range: integer
        minimum_value: 0

