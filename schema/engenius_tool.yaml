  # --- 양식 밖 (이 스키마가 정한 값) ---
  EntityStatus:
    description: >-
      레지스트리 노드(분야·툴)의 수명주기 — 삭제 대신 전이 (docs/01 원칙 9). 상위 스키마 v0.2 §6
      의 산출물 수명주기(작성중→검토중→승인→대체됨|폐기)와는 대상이 다르다: 여기 노드는 사람이
      작성·승인하는 산출물이 아니라 조사에서 나온 기준 노드다. 대응은 통합됨 ≈ 대체됨, 폐기 = 폐기.
    permissible_values:
      활성: {description: 사용 중}
      통합됨: {description: 다른 노드로 통합됨 (Tool.merged_into)}
      폐기: {description: 더 이상 쓰지 않음 — 과거 참조를 위해 노드는 남긴다}
  FeedConfidence:
    description: 공급 연결 신뢰도 (docs/02 7.1).
    permissible_values:
      낮음: {description: 겹친 확장자가 전부 범용 확장자}
      보통: {description: 범용이 아닌 확장자가 하나 이상 겹침}
  ManualBasis:
    description: 수기 구간 판정 근거 (docs/02 7.3).
    permissible_values:
      전달방법: {description: 어느 한쪽의 전달 방법이 수기 전달 값}
      비고: {description: 전달 방법은 아니지만 비고에 수작업 키워드 — 보조 신호}
  StartGrade:
    description: 착수 등급 (docs/02 7.4).
    permissible_values:
      A: {description: 양쪽 모두 자동화 가능}
      B: {description: 한쪽만 자동화 가능}
      C: {description: 둘 다 자동화 불가}
      제외: {description: 어느 한쪽이 폐쇄망 구동 불가}
