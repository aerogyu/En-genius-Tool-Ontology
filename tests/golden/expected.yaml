    usage: 2차유로(SAS)/SAS-02
    automatable: true
  GRADE-C:
    title: 양쪽 다 자동화 불가인 수기 구간 → C
    manual_feed: {from: 시험/TEST-05/out/계측 온도 보정표, to: 2차유로(SAS)/SAS-03/in/계측 온도 보정표, grade: C}
  GRADE-SUPPLIER-B:
    title: 공급 측만 자동화 불가 → B
