    P22: 압축기 COM-01 분류 '설계-2D Layout' → 그 파일 선택지에 있으므로 경고 없음, DataCategory 생성.
    CHOICE-FILE: 구조 STR-01 분류 '설계-2D Layout' → 구조 파일 선택지에는 없으므로 경고 (같은 값인데 파일에 따라 다름 — I28).
    CHOICE-OUT: 터빈 TURB-02 분류 '보고서/문서'(오기)·TURB-03 전달 방법 '메일' → 선택지 밖 경고, 원문 적재.
    REQUIRED-MISSING: 시험 TEST-05 조작 방식·자동화 인터페이스 빈칸 → 필수값 누락 경고 2건, 자동화 불가로 판정.
    I22: 압축기 파일 SW입출력의 SW ID 없는 '형상 검토 메모' 행 → 위에 빈 행이 있어 이어받지 않고 건너뛰고 경고 (이어받기는 tests/test_loader_m31_2.py).
    P21: 제어 파일은 SW ID 를 SW명으로 적었다 (MATLAB, Simulink, 가상-제어로직툴) — 두 시트가 일치하므로 경고 없음.
    D3: 압축기·연소기가 같은 SW ID(COM-01~03)를 쓴다 — 충돌 아님, 입출력 소유는 같은 파일 안에서 해석.
    RESEND: 압축기 파일이 둘(20260917·20260924) — 20260924 만 적재. 이전 파일의 툴(가상-구형설계툴)은 어떤 출력에도 없다 (I33).

