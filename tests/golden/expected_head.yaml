# 골든 기대값 (M2 v3) — 합성 조사 파일(data/synthetic/survey/)로 M3 적재·M4 도출이 내야 할 결과.
# 손으로 쓴 부분: interpretations, decisions, loader, cases.
# 자동 부분: aggregates — tests/golden/oracle.py 가 명세에서 계산한다. test_golden 이 명세·참조 계산과 이 값이 같은지 검사한다.
# 명세를 바꾸면 python tests/golden/make_expected.py 로 다시 만든다 (손으로 쓴 부분은 이 머리말 파일에서 유지).
#
# 키 규칙 (골든 전용 표기)
#   툴사용  = "<분야>/<SW ID>"            분야 = 파일 분야(파트, v0.3 — docs/10). 행의 '담당 부서' 가 달라도 파일 분야이고 경고만
#                                         (P17 개정 2026-09-30: 구조 파일 STR-05 의 담당 부서 '시험' → 키는 구조/STR-05)
#                                         파일 간 같은 (파트, SW ID) 충돌 때만 "<분야>/<SW ID>@<구분>" (I36 — 합성에는 없음)
#   입출력  = "<툴사용>/<in|out>/<명칭>"  같은 파일에서 이 키가 겹치면 달라지는 필드(분류|확장자|전달|연계)를 [..] 로, 완전히 같으면 #순번
#   고아    = "<파일 분야>/<SW ID>(고아)/..."   (규칙 밖 파일은 파일 분야 자리에 '(파트 미상)')
#   툴      = 정규화 키 (docs/02 6.1) — 대표 이름(prefLabel)은 M3 가 정하므로 골든에서 검사하지 않는다

version: 3
spec: data/synthetic/survey_spec.yaml

# docs/02 가 정하지 않아 M2 에서 정한 해석 — M3·M4 는 이대로 구현한다. 바꾸려면 여기와 oracle.py 를 함께 고친다.
interpretations:
  I1-연계SW해석: >-
    연계 SW명에는 제조사 열이 없다. 정규화 키가 툴 키와 같거나, 조사에 나온 제조사명(정규화)을 앞에서 떼어낸 키가
    같으면 그 툴로 해석한다 (예 'ANSYS Fluent' → fluent, 'Microsoft Excel' → excel). 떼고 남는 것이 없으면 떼지 않는다 (I14).
    툴사용의 이름도 같다 (제조사 접두 흡수, Leo 결정 Q3(a) 2026-10-02): 제조사 칸이 비거나 달라도 키가 조사에 나온 어느 제조사명으로
    시작하고 나머지가 다른 행의 툴 키와 같으면 그 툴로 흡수한다 (긴 제조사명부터, 경고 '제조사 접두 흡수'; 별개 판정 쌍은 흡수하지 않음).
    흡수 쌍은 모든 행의 키를 정한 뒤 키 집합 위에서 구해 모든 행에 적용한다 (행 순서 무관). 범용 제조사('자체개발' 등, I34)는
    접두로 쓰지 않는다 (Q3(b), 2026-10-02). 생존 키: 참조 계산은 늘 접두를 뗀 키(사슬의 끝); 적재기는 레지스트리 활성 행이 그룹에
    정확히 하나면 그 키를 살린다 (TOOL ID 유지 — 레지스트리가 없으면 참조 계산과 같다). 별개 판정 쌍이 제3의 키를 거쳐 한 그룹에
    들면 그 그룹은 흡수하지 않고 경고 (명세 distinct 거울); 활성 행이 둘 이상인 그룹은 적재기가 보류하고 검토표로 올린다 (HITL).
    합성 데이터에는 해당 행이 없어 골든 값은 바뀌지 않는다.
  I2-버전토큰: >-
    공백으로 나눈 토큰 중 ^(v\d+(\.\d+)*|\d{4}r\d+|r\d+[a-z]?|sp\d+|\d+(\.\d+)+|(19|20)\d{2})$ 는 버린다
    (예 'CATIA V5' → catia, 'Excel 2016' → excel — 연도 토큰은 2026-10-01 추가). 남은 토큰은 영숫자만 남기기 전에
    rules.yaml tool_token_map 으로 바꾼다 ('c++' → cpp, 'c#' → csharp, 'f#' → fsharp — docs/09 #16 A, 2026-10-02; 'Visual C++' → visualcpp).
  I3-비고신호: >-
    전달 방법은 수기가 아니고(I32 적용 후) 입력·출력 어느 한쪽 비고에 수작업 키워드가 있는 Feed 는 manual=false·manual_basis=비고,
    등급은 수기와 같은 규칙(7.4)으로 매긴다. 착수 순위에 종류 '비고' 로 따로 올리고, 같은 등급 안에서 수기·변환 행 뒤에 둔다
    (그 안의 순서는 I18·I5). 같은 (공급, 수요) 쌍에 수기 행이 있으면 비고 행은 만들지 않는다. (Leo 결정 2026-09-24, Q-I3)
  I4-변환구간: >-
    '숨은변환 의심' (입출력 x, 상대 툴 T) 는 T 의 툴사용 각각과 쌍으로 펼친다 (D1-2). x 가 입력이면 (T 의 툴사용 → x 소유),
    출력이면 (x 소유 → T 의 툴사용). 같은 (공급, 수요, 종류) 쌍은 한 행으로 합치고 근거 입출력을 모두 적는다.
  I5-정렬동률: 정렬 키가 모두 같으면 공급 툴사용 키, 수요 툴사용 키 문자열 순 (파이썬 문자열 비교).
  I6-인원수없음: 사용 인원수가 정수가 아니면(원문만 보존) 정렬에서 가장 작은 값으로 본다.
  I7-허브지표: >-
    툴별 = Feed(방향 무관)로 이어진 서로 다른 상대 툴 수 (자기 자신 제외). 툴사용별 = 서로 다른 상대 툴사용 수.
    둘 다 보고만 하고 착수 순위에는 쓰지 않는다.
  I8-영향범위: CQ06 결과 = 주어진 (분류, 확장자)를 소비하는 툴사용 자신 + eg:feeds+ 로 도달하는 하류.
  I9-고아: 고아 입출력(io_owner 없음)은 Feed·CQ04 대조·착수 순위 대상이 아니다.
  I10-누락후보키: >-
    CQ09 는 해석 못 한 연계 SW명을 정규화 키로 묶어 언급 횟수·언급 분야(소유 툴사용의 분야)를 센다. 인명처럼 보이는 조각은 후보에 넣지 않는다 (경고만, docs/09 #20).
    적재기는 같은 키를 툴 통합 검토표에도 사유 '연계SW 미해석' 행으로 올린다 (docs/09 #17, 2026-10-12) — 툴A = 기존 툴 키 제안(포함 또는 유사도 ≥ 임계값일 때만,
    아니면 빈칸 + 비슷한 키 힌트), 툴B = 연계 키, 원문은 쓰지 않는다. 기존 툴로 통합 판정한 키는 merge_pairs [툴 키, 연계 키] 로 그 툴에 해석되어 후보에서 빠지고,
    툴A_키를 비운 별개 판정(기존 툴 아님 = 조사 누락 확인 — tool_aliases.yaml partner_missing)은 후보에 남되 검토표에만 다시 오르지 않는다.
    골든 설정에는 판정이 없어 값은 바뀌지 않는다.
  I11-무연결판정: CQ05 ② 는 입출력이 있으나 소유 입출력 어디에도 Feed 가 없고, 해석된 신고 상대도 없는 툴사용 (해석 못 한 연계 SW 만 있어도 무연결).
  I12-확장자: >-
    NFKC·소문자 뒤, 괄호 안이 '.확장자'(점으로 시작 — '*.' 허용; 여럿이면 구분자로 이음)뿐이면 괄호 안 확장자를 쓰고
    괄호 바로 앞(공백 허용)의 한 단어는 형식 이름으로 버린다 (Excel(.xlsx)→xlsx, Parasolid (.x_t)→x_t, NASTRAN(.bdf, .f06)→bdf·f06;
    버린 형식 이름에 '사내' 가 들어 있으면 inhouse_format=true — 사내(.dat)→dat·사내). 여러 단어 형식명은 앞 단어가 토큰으로 남는다.
    괄호 앞 단어가 '.'·'*.' 으로 시작하면 형식 이름이 아니라 확장자라 버리지 않는다 (.cas(.dat)→cas·dat — 2026-10-12 검토 수리; 점 없는 단어 x_t(.x_b) 는 형식 이름으로 본다).
    그 밖의 괄호는 주석으로 떼고(안에 '사내' 가 있으면 inhouse_format=true — .dat(ASCII)→dat, STEP(AP214)→stp), 토큰 '사내' 도 inhouse_format=true.
    구분자는 / , ; · ㆍ ・ 와 모든 공백 문자. 별칭(step→stp, 엑셀·excel→xlsx, 워드·word→docx, 파워포인트·powerpoint→pptx 등)을 먼저 적용하고,
    결과가 확장자 패턴(소문자·숫자·_+-, 점으로 이은 다중 확장자 허용)이 아니거나 숫자만 있는 토큰(AP 214 의 214)이거나
    extensions.yaml non_extension_tokens(or·and·또는·및·file·파일·ascii·binary·parasolid·ap·ap203·ap214·ap242)이면 버리고 원문 보존 +
    경고 '확장자 매핑 실패'. 점으로 이은 토큰이 compound_extensions(tar.gz·cas.h5·dat.h5 등) 밖이면(model.stp) 값은 그대로 쓰고
    경고 '확장자 다중 점 확인' 만 (docs/09 #10 A·Q2 Leo 2026-09-28, 형식 이름 범위·숫자 토큰 Leo 2026-10-12). 합성 골든 값은 바뀌지 않는다.
  I13-확장자미기재: >-
    정규화 확장자가 비면(빈 값 토큰이거나 모든 토큰이 매핑 실패 — Parasolid 단독 등, I12) 그 입출력은 Feed 를 만들지 않고, 도출 단계 경고를 입출력마다 1건 낸다.
    CQ04 에서는 신고 상대마다 '확장자 미기재' 로 판정한다 — '숨은변환 의심' 이 아니며 변환 구간도 만들지 않는다.
  I14-툴명제조사명: 툴 정규화 키에서 제조사 접두를 떼고 남는 것이 없으면 떼지 않는다 (예 Tecplot/Tecplot → tecplot).
  I15-예시행판별: >-
    적재 열 전체(B 'SW명(자동)' 수식·K '실무 문의처' 제외)가 템플릿 예시 행과 같으면 행 위치와 무관하게 제외한다.
    예시의 비고 문구('(예시 행 — 참고 후 그대로 두셔도 됩니다)')까지 같아야 하므로, SAS-01=SANTA 같은 실제 응답은 제외되지 않는다.
    일부만 같은 행은 응답으로 적재한다. 단 '예시와 거의 같은 행' 은 경고한다 — 예시의 정보 열(예시 값이 비지 않고 빈 값 토큰(I16)도 아니며 그 파일에 있는 열;
    이런 열이 rules.yaml loader.example_near_min_cols(5) 보다 적은 예시와는 비율을 보지 않는다) 가운데 같은 칸의 비율이 loader.example_near_ratio(0.8)
    이상인 예시가 있거나(가장 높은 비율, 같으면 비교 칸이 많은 예시), 기본정보 비고가 예시 비고 문구와 같은 행. 경고 '예시와 거의 같은 행: <파일> <시트>
    <n>행 (<같은 칸>/<비교 칸> 열 같음[, 비고가 예시 문구]) — 응답으로 적재, 양식 예시가 남은 것인지 확인' + 수정 요청표 행, 판별은 원문 셀(병합 채움 뒤·값 대응표
    전)로 하며 응답이므로 입출력 Tool ID 이어받기(I22)를 끊지 않는다. 같은 파일·같은 Tool ID(#18 키)에서 앞 행이 예시 유사이고 뒤 행이 아니면 앞 행을 빼고
    뒤 행을 쓴다 — docs/02 5장 4 '먼저 나온 행' 의 예외: 제외 사유 'SW ID 중복 — 예시와 거의 같은 행이라 제외 (<n>행 사용, #3)', 경고 '중복 SW ID — 예시 유사 행
    제외: …', 수정 요청 '예시 행 남음' (둘 다 예시 유사이거나 뒤 행만 유사하면 '먼저 나온 행' 그대로). 한 시트에 예시 유사 행이 있는데 예시와 정확히 같은
    행이 0 이면 파일·시트마다 '예시 행 판별 설정 점검' 경고 (template_examples.yaml 이 그 양식과 다를 수 있음 — 사내 양식판의 예시는 오버레이
    data/real/config/template_examples.yaml 에 시트별 합집합으로 더한다). 경고의 Tool ID·툴명은 인명 유사면 가린다 (C5). docs/09 #3 A (Leo 2026-09-28),
    정보 열 기준 2026-10-12 (v1.1 TA-01 예시는 절반이 NA·모름이라 비지 않은 열 전부로 세면 NA 투성이 실제 응답이 0.80~0.83 이 됐다).
    합성 응답의 최고 유사도는 기본정보 19/30 = 0.633·입출력 4/7 = 0.571 이라 골든 값은 바뀌지 않는다.
  I16-빈값토큰: >-
    확장자·연계 SW명 공통. 셀 전체를 먼저 본다: '', 없음, 모름, -, —, –, n/a, na, 해당없음, 해당 없음.
    정수 열(사용 인원수·보유 수량)의 빈 값 토큰은 빈칸으로 보고 원문도 남기지 않는다 — 정수 변환 실패 경고 없음, 파일당 건수 한 줄
    (docs/09 #21 2단, 2026-10-02). 연계 SW명 조각이 범용 이름(I34)이면 빈 값처럼 버린다.
    만료 시기 칸(rules.yaml loader.month_slots)의 문자열이 빈 값 토큰이거나 loader.month_blank_values('영구' — 양식 안내 '영구면 공란' 인데
    v1.1 예시 행이 '영구')면 빈칸으로 보고 원문을 남기지 않는다 — 파일당 '빈 값 표기 만료 시기: <파일> <n>칸 — …' 한 줄 (docs/09 #21 3단, Leo 2026-10-12).
    착수 등급의 자동화 판정(docs/02 7.4)에서 자동화 IF 의 빈 값 토큰(NA·- 등)은 자동화 불가 — {없음, 모름} 과 같다. 3D 지도·MCP·M4 가
    한 정의(Normalizer.automatable)를 쓰고 참조 계산은 독립 구현 (2026-10-12; 합성 자동화 IF 에는 없음·모름 밖의 빈 값 토큰이 없어 골든 값은 그대로).
  I17-연계SW구분자: "NFKC 후 , ; / · ㆍ ・ 줄바꿈으로 나눈다 ('/' 가 든 제품명은 쪼개진다 — 필요하면 tool_aliases 로 보완)."
  I18-정렬방향: 등급 A → B → C → 제외, 수요 측 사용 빈도·인원수·우선순위 내림차순, 다음 공급 측 같은 순서.
  I19-CQ01시작점: 상류·하류 탐색 결과에 시작 툴사용 자신은 넣지 않는다 (순환으로 돌아와도).
  I20-분류분야생성: DataCategory·Field 는 적재 행에 나온 값만 만든다 (선택지에만 있는 값은 만들지 않음). 분야 매트릭스는 대각(같은 분야) 포함.
  I21-수기판정: 전달 방법이 수기 값('메일·수기 전달')과 정확히 같을 때만 수기. 목록 밖 값('메일')은 수기가 아니고 선택지 밖 경고.
  I22-SWID없는행: >-
    SW ID 칸이 비었지만 내용이 있는 행은 건너뛰고 경고한다 (docs/02 5장 2 '건너뛴다' + 6 '조용히 버리지 않는다').
    단 입출력 시트에서는 바로 위 행(빈 행·예시 행 없이 붙어 있는 행)의 SW ID 를 이어받고 경고 'Tool ID 이어받음' 을 남긴다
    (rules.yaml loader.io_id_fill_down, Leo 2026-10-09 — 응답자들이 같은 툴의 여러 행에 첫 행만 ID 를 적었다). 기본정보 시트는 이어받지 않는다.
  I23-동률과유사도: >-
    속성 다수값이 동률이면 사전순 첫 값. 통합 후보 유사도는 difflib 비율의 양방향 최댓값 ≥ 0.85, 또는 한쪽이 다른 쪽을 포함
    (포함은 짧은 키가 3자 이상일 때만 — rules.yaml candidate_min_contain_len, docs/09 #16 A 2026-10-02). 행별 '미상:' 키(I34)는 후보에 올리지 않는다.
  I24-허브상위N: 상위 N(10) 은 N 번째 값과 같은 동률을 모두 포함한다.
  I25-수기근거: 같은 (공급, 수요) 쌍의 수기 Feed 가 여럿이면 착수 행 1개, 근거 입출력을 모두 적는다.
  I26-자기쌍금지: 변환 구간을 펼칠 때 입출력 소유 툴사용 자신과의 쌍은 만들지 않는다.
  I27-셀값규칙: >-
    문자열 슬롯의 정수 셀은 그대로 문자열(경고 없음 — '01'→1 같은 선행 0 소실은 탐지할 수 없는 한계), 정수값 실수도 소수점 없이(경고 없음),
    그 밖의 실수는 문자열 + '엑셀 숫자 변환 가능성' 경고. 날짜 셀은 만료 시기면 YYYY-MM, 그 밖의 문자열 슬롯이면 ISO 문자열 + 경고.
    만료 시기의 **문자열 셀**(docs/09 #21 3단, 2026-10-12): NFKC·앞뒤 공백 뒤 전체가 YYYY[.-/]M[.] · YYYY[.-/]M[.-/]D[.] · 'YYYY년 M월( D일)'
    (구분자 앞뒤 공백 허용, 월 1~12·일 1~31)이면 YYYY-MM — 원문이 이미 그 표기가 아니면 경고 '만료 시기 표기 변환: <위치> '<원문>' → '<YYYY-MM>''.
    그 밖 문자열은 원문 보존 + 경고 '만료 시기 형식 아님: <위치> '<원문>' — 원문 보존 (YYYY-MM 으로)' + 수정 요청 '만료 시기 형식' (원문이 인명 유사면
    값 생략; 스키마 층 Pydantic·SHACL 은 계속 패턴 위반으로 본다, D4). 빈 값 토큰·'영구' 는 I16. 값 대응표(value_aliases)에 적힌 원문은 이 규칙
    없이 대응표가 바꾼다. 실수 셀(2027.1)은 위 실수 규칙 그대로 — 문자열로 바꾼 뒤 정규화하면 2027-01 로 잘못 바뀐다 (사례 D5-expiry-float).
  I28-선택지검사: >-
    선택지 목록은 그 파일의 선택지 시트 기준 (파일마다 다를 수 있음). 필수(*) 빈칸은 '필수값 누락' 경고.
    목록 밖 값이 빈 값 토큰(I16 — NA·- 등)이면 선택지 밖 경고 대신 파일당 한 줄 '빈 값 표기(NA·-·해당없음 등) 드롭다운 칸: <파일> <n>칸 — …' 이고
    원문은 보존한다 (양식 v1.1 작성안내가 'NA' 를 정식 응답으로 안내 — 빈칸으로 바꾸면 필수 칸에서 '필수값 누락' 이 쏟아진다; 스키마 층 Pydantic·SHACL 은
    위반으로 본다, D4). docs/09 #21 1단 (2026-10-02 구현, 기록 2026-10-12 — Leo: 현행대로).
  I29-인명패턴: >-
    자유 텍스트 슬롯(용도 상세·업무 요약·자동화 상세·희망 작업·애로 구간·대체 계획·비고)에서 직급어 + '(내선' 이 보이면 경고하고 값은 보존.
    적재하는 모든 문자열 열은 rules.yaml person_patterns_all(직급+님·에게·께, 이름+직급, 이름(직급), 내선 번호, 휴대전화 — docs/09 #20 1-A 승인 목록; 빠졌던 '직급+에게·께'·
    '이름(직급)' 은 2026-10-12 검토 수리로 보충)로도 검사한다 — 경고 '인명 유사 패턴: <위치> '<열>'' (값을 옮기지 않는다). 같은 판정으로 경고·수정 요청표·검토표 표기 칸에
    값을 옮길 때 인명 유사면 '[인명 유사 — 값 생략]' (행 경고의 위치 문구 — Tool ID·데이터명 — 포함, C5), 인명 유사 연계 SW명 조각은 조사 누락 후보에 올리지 않는다 (#20 (2)).
    '실무 문의처' 열과 작성안내 시트는 읽지 않으므로 검사 대상도 아니다. 합성에서 걸리는 칸은 그대로라 골든 값은 바뀌지 않는다 (D6 3곳).
  I30-헤더매핑: >-
    NFKC 후 공백·'*' 를 무시하고 비교. 매핑 안 된 헤더는 경고. B 수식 열·K 문의처 열은 의도적 무시(경고 아님) — 매핑보다 먼저 본다.
    추가 문구는 config/header_map.yaml 과 사내 오버레이 data/real/config/header_map.yaml 의 (시트, 슬롯)별 합집합 (저장소 문구 먼저, 지우기 없음).
    시트 키는 정규 이름(SW기본정보·SW입출력) 또는 rules.yaml loader.sheets 후보('Tool 입출력' 등). 설정 오류(ConfigError — 파일 경로·시트·슬롯만,
    헤더 문구는 넣지 않는다): 형식(문구는 목록) · 모르는 시트·슬롯 · 제외 열 문구(실무 문의처·No.·자동 수식 열)나 인명 열 낱말(문의처·담당자·연락처·작성자)이 든
    문구 (절대 규칙 5) · 다른 슬롯의 양식 기본 문구 가로채기 · 같은 문구를 두 슬롯에 (2026-10-12). 참조 계산은 헤더를 명세 header_overrides 로 다룬다.
  I31-파일명분야: >-
    파일명 'SW조사_<약칭>_<YYYYMMDD>[ (n)].xlsx'(v1.0 작성안내 B26) 또는 'Tool조사_<약칭>_<YYYYMMDD>[ (n)].xlsx'(v1.1 B27, 정식) 의 두 번째
    조각이 parts.yaml 약칭(parts·file_bundles·synthetic_parts)이면 그 파일의 파트다 (묶음 약칭이면 행의 Tool ID 앞부분, docs/10). 브라우저 사본 꼬리
    '(n)'(앞 공백 허용, 숫자만)은 사본 번호로 읽어 재발송 판정(I33)에 넣는다 (Leo 2026-10-12) — 숫자 괄호만 허용하므로 기록 이름에 인명이 들어갈 수 없다.
    그 밖('- 복사본'·'(최종)'·인명 꼬리·모르는 약칭·.xlsx 아님)은 규칙 밖 — 파트 미상, 기록 이름 'Tool조사_규칙밖_<sha256 앞 10자>[-k].xlsx'
    (내용 해시라 같은 내용 사본은 같은 이름이 되므로 둘째부터 '-2'·'-3'; 날짜 8자리 조건 때문에 이 이름도 규칙 밖), 원래 이름은 어디에도 쓰지 않는다
    (docs/09 #8 A·C4). 실행마다 입력 폴더 정렬 순번(load_log files[].index)을 남겨 해시 이름 파일을 찾게 한다.
    약칭 개명 (docs/09 #25b, 2026-10-12): parts.yaml 새 약칭 항목의 renamed_from 에 적힌 옛 약칭도 인정하되 새 약칭으로 읽는다 — 파일명(원래 이름 그대로
    기록, 실제로 적재하면 경고 '옛 약칭 파일명')과 묶음 파일 행의 Tool ID 앞부분 모두. 그래서 I33 은 옛·새 약칭 파일을 한 파트의 재발송으로 비교하고,
    적재는 레지스트리 분야 키만 옛 → 새로 바꿔 FLD ID 를 유지한다 (툴사용 키 (FLD ID, Tool ID)·입출력 해시도 그대로 — 고아 입출력은 파일 약칭을 해시에 써서 바뀐다).
    범용 이름 툴의 행별 키 '미상:<옛>/…'(I34)는 툴 표의 키 접두도 '미상:<새>/…' 로 바꿔 TOOL ID 를 유지한다 (새 키 행이 이미 있고 옛 행이 활성이면 경고 '범용 이름 툴 키
    개명 보류'; 2026-10-12 검토 수리). 옛·새 약칭 파일의 날짜·사본 번호가 같으면 새 약칭 파일이 최신이다 (I33).
    옛·새 키가 레지스트리에 둘 다 있으면 바꾸지 않고 경고 '파트 약칭 개명 보류'. 정식 이름(name)만 바꾸면 라벨만 갱신된다. renamed_from 없이 한 실행에서
    FLD 가 새로 생기고 다른 FLD 가 활성 → 폐기면 경고 '파트 신규·폐기 동시' (읽지 못한 파일이 있는 실행은 폐기 판정이 없어 나오지 않는다). 분할·통합(succeeded_by)은 범위 밖.
  I32-수기범위: >-
    전달 방법이 수기인 행이 연계 SW 를 적었으면(빈 값 토큰 아님) 그 수기 신호는 적힌 상대 중 해석된 툴의 툴사용과의 Feed 에만 적용한다.
    적힌 상대가 모두 해석 못 한 이름이면 어떤 Feed 에도 수기로 적용되지 않는다. 연계 SW 가 비었으면 docs/02 7.3 그대로 모든 상대에 적용.
    Feed 의 manual = (o 가 i 소유 툴에 수기 적용) 또는 (i 가 o 소유 툴에 수기 적용). (Leo 결정 2026-09-24, Q-D2)
  I33-재발송: >-
    같은 파일 분야(I31)의 파일이 여럿이면 (파일명 날짜, 사본 번호, 새 약칭 파일명인가, 파일명) 이 가장 큰 파일 하나만 적재한다 — 같은 날짜면 사본 '(n)' 번호가 큰 쪽
    (나중에 받은 파일; 원본은 0. 파일명만 비교하면 '.' > '(' 라 원본이 이겨 새 내용이 버려진다, Leo 2026-10-12). 날짜·사본 번호까지 같으면 옛 약칭(I31 renamed_from)이 아닌
    새 약칭 파일 — renamed_from 은 옛 약칭이 먼저 쓰였다는 뜻이다 (파일명 사전순이면 한글 옛 약칭이 이겨 고친 새 파일을 버렸다, 2026-10-12 검토 수리). 나머지는 읽기만 하고 적재하지 않으며
    파일마다 '재발송으로 대체: <이전 파일> → <유효 파일> (적재 안 함)' 경고를 남긴다 (두 파일 내용(sha256)이 같으면 끝에 ' (내용 같음)').
    대체된 파일의 행은 제외 건수에 넣지 않는다. 그 뒤 남은 파일 가운데 내용(sha256)이 같은 파일은 한 번만 적재한다 — 규칙 안 파일 우선, 다음 입력
    순서. 나머지는 '같은 내용 파일: <X> = <Y> (한 번만 적재)' 경고(두 규칙 안 파일의 약칭이 다르면 ' — 약칭이 다르다, 어느 파트 파일인지 확인'),
    제외 건수에 넣지 않는다. 대체된 파일과 내용이 같은 파일(탐색기 사본·다른 약칭으로 저장한 규칙 안 파일)도 — 그 대체된 파일을 대체한 최신 파일 자신이 아니면 — 적재하지 않고
    '같은 내용 파일: <X> = <대체된 Y> (<Y> 은 재발송으로 대체됨 — 적재 안 함)[ — 약칭이 다르다, …]' (버린 옛 데이터가 사본으로 다시 들어와 툴사용이 두 번 잡히지 않게,
    2026-10-12 검토 수리). (Leo 결정 2026-09-24 Q-R1, 사본·같은 내용 2026-10-12)
  I34-범용툴이름: >-
    정규화 키가 비거나('(자체 매크로)', '-') rules.yaml generic_tool_names 의 키('자체개발'·'사내툴'·'매크로' 등)와 같으면 통합하지 않고
    행별 키 '미상:<파트>/<Tool ID>[@구분]' 로 별개 툴로 둔다 ('@구분' 은 I36 파일 간 충돌 때만) — 경고 '툴 이름 범용/비어 있음' + 수정 요청표 행
    '툴 이름을 지어 주세요' (Leo 결정 Q3(b) 2026-10-02: 분야마다 자체개발 툴이 달라 통합할 수 없다). 파트 약칭 개명(I31) 때는 키의 '<파트>' 부분을 레지스트리에서
    새 약칭으로 바꿔 TOOL ID 를 유지한다 (2026-10-12 검토 수리). 합성 데이터의 이름은 모두 키가 있어 골든 값은 바뀌지 않는다.
  I35-통합판정의미: >-
    apply-review 의 '통합' 은 검토표의 툴A_키·툴B_키를 판정 이력 merge_pairs 에 [A 키, B 키] 로 쌓고 (생존 키 = A 키, TOOL ID 유지; 대표 이름은
    labels 로만 — 그룹을 새 키로 옮기지 않는다), 적재기가 읽는 merge_keys[B 키] = 대표 키 는 저장 때마다 이력에서 다시 계산한다 (대표끼리 이어
    깊이 1; 같은 그룹이면 라벨만 갱신). 대표 이름은 판정 당시의 대표 키에 labels 로만 두고 옮기거나 승계하지 않는다 — 그룹 이름은 적재기가
    labels[대표 키] → 이력에서 가장 최근에 A 키로 적힌 키의 라벨 → 키 정렬 순 → 다수결 표기 순으로 고른다 (별개로 쪼개면 각 키는 자기 라벨로). '별개' 는 직접 쌍([A,B] 어느 순서든, aliases 변형 하나)을 이력에서
    지우고 다시 계산한 뒤 distinct 에 넣으며, 직접 쌍이 없는데 대표가 같은(간접 사슬) 쌍은 오류로 사람이 고친다 — 그래서 통합(c=b)·통합(a=c)·
    별개(a/c) 뒤 b 는 c 와만 통합으로 남는다. merge_keys 만 있는 옛 파일은 이력으로 승격해 읽는다. 적재기는 aliases·merge_keys 를 합쳐
    추이적으로 닫고, 통합됨 레지스트리 행이 다시 활성 그룹으로 보이면 같은 ID 로 되살린다 (docs/09 #2 A·#14 최소형·C2, 2026-10-02).
    검토표의 연계 행(I10)도 같은 merge_pairs 로 쌓는다 — A = 기존 툴 키 생존(그 검토표 실행의 툴 키여야 한다 — load_log tool_keys), B = 연계 키(레지스트리 행이 없다);
    툴A_키 빈칸 + 별개는 partner_missing (docs/09 #17). 이름 별칭(aliases)의 변형 표기는 툴사용의 키(제조사 뗀 키)로 맞지 않으면 제조사를 떼지 않은
    이름 키로도 찾는다 (#2 (3) — 연계 SW명 해석과 같은 조건). 적재기는 이번 적재의 툴·연계 SW명 어디에도 키가 맞지 않는 판정 항목(merge_pairs — 대표가
    보이면 적용된 것으로 봄·distinct·labels·partner_missing, 오버레이 파일의 aliases 변형)을 경고 '별칭 미적용: <파일> <절> <항목> — …' 으로 알린다 —
    저장소 config/ 의 공개 별칭 사전(aliases)은 쓰지 않는 표기가 있는 게 정상이라 검사하지 않는다 (#2 (4), 2026-10-12; 값은 인명 유사면 가림).
    apply-review 는 엑셀 오류 값(#NAME? 등)·사람 이름처럼 보이는 대표 이름을 거부하고 파일을 바꾸지 않는다 (#25d).
    합성 골든에는 별칭이 없어 값은 바뀌지 않는다.
  I36-파일간같은툴사용: >-
    적재하는 두 파일 이상에 같은 (파트, Tool ID 비교 키(#18 — 전각·대소문자·숫자 앞 0 무시)) 가 나오면 (묶음 파일 + 분할 전용 파일, 규칙 밖 파일끼리 등)
    둘 다 적재하고 (파트, 파일 쌍)마다 경고 '파일 간 같은 (파트, Tool ID): <파트|(파트 미상)> — <파일 A> ↔ <파일 B> <n>건 (예: …) — 둘 다 적재, 구분 키 …'.
    전용 파일(파일 약칭 = 그 행의 파트) 행이 정확히 하나면 그 행만 원래 키를 쓰고, 원문 Tool ID 가 실제로 겹치는 나머지 행은 레지스트리 USE 키를
    '<Tool ID>@<파일 약칭>' (규칙 밖 파일이면 '@file-<sha256 앞 10자>') 로 구분한다 — 원래 파일명은 꼬리에도 해시 입력에도 쓰지 않는다 (C4; 그래서 규칙 밖
    파일의 구분 키는 내용이 바뀔 때마다 새 USE ID). 표기만 다르면 키가 이미 달라 경고만 ('… (Tool ID 표기가 달라 키는 이미 다름)'). 범용 행별 키(I34)도
    구분 꼬리를 쓴다. 규칙 밖 파일의 Tool ID 가 규칙 안 파일과 겹치면 '규칙 밖 파일의 Tool ID 가 다른 파일과 겹침: <규칙 밖> ↔ <규칙 안> <n>개 — …' 경고
    (이름이 틀린 재발송·사본 의심, 둘 다 적재). 경고의 Tool ID 는 인명 유사면 가린다 (C5). docs/09 #1 (a), 2026-10-12.
    합성 골든에는 해당 없음 — 적재 파일끼리 파트가 다르다 (D3 압축기·연소기 COM-01~03 은 파트가 달라 충돌이 아니다).
  I37-엑셀층신호: >-
    엑셀 파일 층의 이상 신호 (docs/09 7장, Leo 2026-10-12). ① 수식 결과 오류 셀(셀 형식 'e', 또는 문자열이 #N/A·#REF!·#VALUE!·#DIV/0!·#NAME?·#NUM!·#NULL! 등)은
    빈칸으로 보고(D4 예외 — 오류 표기는 응답 값이 아니다) 시트·열마다 경고 '수식 오류 셀: <파일> <시트> '<열>' <n>칸 — 빈칸으로 봄 …' 한 줄 + 행마다 수정 요청
    '수식 오류 셀'(값 = 오류 표기; 같은 칸의 필수값 누락 수정 요청은 내지 않는다). Tool ID 칸이 오류면 그 행은 제외(사유 'Tool ID 수식 오류 (I37)')하고
    입출력 시트에서는 이어받기(I22) 대상도 아니며 아래 행에 ID 를 넘겨주지도 않는다 (빈칸으로만 보면 위 행 ID 를 붙인다). 세로 병합의 첫 칸이 오류면 채우지 않는다.
    ② 캐시 없는 수식(값 없이 수식만 있는 칸)은 시트·열마다 경고 '캐시 없는 수식' (엑셀에서 열어 저장하면 읽힌다). 판별은 시트 XML 로 한다 — <f> 가 있고 <v> 가 없거나,
    <v> 가 비었는데 형식(t)이 'str' 이 아닌 칸. 엑셀·LibreOffice 가 빈 문자열을 돌려주는 수식(=IFERROR(…,""))을 저장한 t="str" + 빈 <v> 는 캐시된 빈 문자열이라 경고하지 않는다
    (openpyxl 은 셋을 모두 None 으로 읽어 다시 저장해도 사라지지 않는 거짓 경고가 났다 — 2026-10-12 검토 수리).
    ①② 모두 내용 행만 센다 — 오류·수식만 있는 행은 빈 행. ③ 숨긴 행(필터·그룹 접기 포함)은 그대로 적재하고 시트마다 경고 '숨긴 행: <파일> <시트> <k>행 —
    응답으로 적재함 (첫 행 <n>)' + 행마다 수정 요청 (정확한 예시 행은 세지 않는다). ④ 읽은 기본정보·입출력 시트, 선택지 시트, rules.yaml loader.other_sheets
    (작성안내) 밖의 내용 있는 시트는 경고 — 2행 헤더가 기본정보·입출력 양식 열의 절반 이상과 맞으면 '양식 사본 시트: <파일> '<시트>'[ (숨김)] — <시트> 와 같은
    헤더, 내용 <k>행, 적재하지 않음' + 수정 요청, 아니면 '양식 밖 시트: … — 읽지 않음' (시트 이름은 인명 유사면 가린다; 사본은 적재하지 않는다 — HITL).
    ⑤ 읽은 파일(대체·같은 내용·읽지 못한 파일 제외)에서 적재한 툴사용이 0건이면 경고 '툴사용 0건: <파일> — …' + 수정 요청.
    참조 계산은 명세 층이라 해당 없음 (합성 파일·공개 양식의 적재 열에는 오류·수식·숨긴 행이 없고 그 밖 시트는 작성안내뿐, 모든 적재 파일에 툴사용이 있다 — 골든 값 불변).

# Leo 가 결정한 규칙 (2026-09-24) — 골든은 이 결정으로 계산돼 있다
decisions:
  Q-R1-재발송: 같은 분야 파일이 두 개 오면 최신 파일만 적재한다 → I33. 합성 데이터에 압축기 이전 파일(20260917)을 넣었다 (사례 RESEND).
  Q-D2-수기번짐: >-
    연계 SW 를 적은 수기 행은 그 상대에게만 수기 적용 → I32. SAS-01 '유량 분배 결과' 수기 행(상대 가상-미조사툴)은 SAS-03 입력과
    Feed 는 되지만 수기가 아니다 (사례 D2). 운영 중 이 좁힘으로 놓치는 구간이 보이면 다시 검토한다 ('우선 그렇게 해보자').
  Q-I3-비고신호: 비고에만 수작업이 적힌 구간도 착수 순위에 종류 '비고' 로 올린다 → I3 개정 (사례 P11).

