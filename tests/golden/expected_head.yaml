  excluded_total: 33                     # 예시 31 + 중복 SW ID 1 (구조 STR-03 Abaqus) + SW ID 없는 내용 행 1 (압축기)
  loaded: {usages: 34, io_rows: 77, fields: 8, categories: 8}
  person_tokens_absent: >-
    다음 문자열은 어떤 출력(TTL·보고서·로그)에도 나오면 안 된다 — 실무 문의처 열과 작성안내 시트 값:
    '홍OO 책임(내선 1234)', 'OOO 수석(내선 9999)', '내선 9998'.
    (D6 사례의 'OOO 책임(내선 0000)'·'OOO 선임(내선 0000)' 은 자유 텍스트라 값이 보존되고 경고만 난다 — 다른 토큰이다)
  excel_layer_notes: >-
    합성 파일은 openpyxl 로 만들어 B 열 수식의 캐시값이 없고 데이터 유효성도 openpyxl 형식이다. 실제 회신 파일(Excel 저장본)에는
    B 열 캐시값('SANTA', 'ID 확인' 등)이 있고 유효성이 확장 형식이라 openpyxl 이 못 읽을 수 있다. 적재기는 B 열 값과 데이터
    유효성을 쓰지 않고, 헤더 이름·선택지 시트 값만 쓴다.
  cases:
    P10-b: 제어 파일 SW입출력 5·6행(예시 위치)의 MATLAB 행 2개는 응답이다 — 적재한다 (내용이 예시와 다름).
    P10-c: 2차유로(SAS) 파일의 예시 행(SAS-01 SANTA)과 실제 SAS-01(가상-1D네트워크)은 SW ID 가 같지만 내용이 다르다 — 예시만 제외, 중복 SW ID 경고 없음.
    I15: 성능 파일 SW기본정보 9행에 예시 행 복사본 — 위치와 무관하게 예시로 제외 (경고 아님, 제외 로그에 사유).
    GAP: 성능 파일 SW입출력 중간의 빈 행 다음 행들(PERF-02~04)도 적재한다.
    HEADER: 터빈 파일은 헤더 '파일형식/확장자＊'·'사용빈도' 로 바뀌었지만 같은 슬롯으로 매핑되고, 덧붙인 '내부 메모' 열만 경고, 그 값은 적재하지 않는다.
    D5-int: 터빈 TURB-02 버전 정수 2024 → "2024", 압축기 COM-02 2210, 시험 TEST-04 365 — 경고 없음.
    D5-float: 구조 STR-01 버전 실수 5.1 → "5.1" + 경고.
    D5-expiry-float: 성능 PERF-02 만료 시기 실수 2027.1 → "2027.1" + 경고, license_expiry 패턴(YYYY-MM) 위반 → SHACL 경고.
    D5-date: 성능 PERF-03 만료 시기 날짜 → "2027-03" (경고 없음).
    D5-date-in-string: 구조 STR-03 버전 날짜 셀 → "2023-01-01" + 경고.
    D5-raw: 2차유로 SAS-03 사용 인원수 '약 4명' → user_count 없음, user_count_raw 보존 + 경고.
    D6: 인명 유사 패턴 3곳 — 시험 TEST-02 비고, 2차유로 SAS-02 애로 구간, 터빈 TURB-01 출력 비고 (SW입출력). 값은 보존.
    P20: 제어 MATLAB 조작 방식 'GUI+CLI(일부)' → 원문 적재, 선택지 밖 경고. 등급은 자동화 IF(내장 스크립팅)로 자동화 가능.
    P22: 압축기 COM-01 분류 '설계-2D Layout' → 그 파일 선택지에 있으므로 경고 없음, DataCategory 생성.
    CHOICE-FILE: 구조 STR-01 분류 '설계-2D Layout' → 구조 파일 선택지에는 없으므로 경고 (같은 값인데 파일에 따라 다름 — I28).
    CHOICE-OUT: 터빈 TURB-02 분류 '보고서/문서'(오기)·TURB-03 전달 방법 '메일' → 선택지 밖 경고, 원문 적재.
    REQUIRED-MISSING: 시험 TEST-05 조작 방식·자동화 인터페이스 빈칸 → 필수값 누락 경고 2건, 자동화 불가로 판정.
    I22: 압축기 파일 SW입출력의 SW ID 없는 '형상 검토 메모' 행 → 건너뛰고 경고.
    P21: 제어 파일은 SW ID 를 SW명으로 적었다 (MATLAB, Simulink, 가상-제어로직툴) — 두 시트가 일치하므로 경고 없음.
    D3: 압축기·연소기가 같은 SW ID(COM-01~03)를 쓴다 — 충돌 아님, 입출력 소유는 같은 파일 안에서 해석.

# 심어 둔 사례별 기대값 — test_golden 이 참조 계산과 일치하는지 검사한다
cases:
  P1:
    title: 3단 수기 체인 가상-성능덱 → Excel 상관식 → 가상-1D네트워크 (첫 구간은 양쪽 CLI 가능)
    manual_feeds:
      - {from: 성능/PERF-01/out/성능 경계조건 표, to: 2차유로(SAS)/SAS-02/in/성능 경계조건, grade: A, confidence: 낮음, declared: true}
      - {from: 2차유로(SAS)/SAS-02/out/보정 경계조건, to: 2차유로(SAS)/SAS-01/in/보정 경계조건, grade: A, confidence: 낮음, declared: true}
    both_cli_hop: {supplier: 성능/PERF-01, consumer: 2차유로(SAS)/SAS-02}
