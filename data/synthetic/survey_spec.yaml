# 합성 조사 명세 (M2) — 실제 조사 데이터가 아니다.
# 툴 이름은 공개 상용 툴 또는 '가상-' 접두 가상 툴만, 인명·사내 경로·문서번호는 쓰지 않는다 (CLAUDE.md 절대 규칙 1·2).
# python -m engenius_onto synth 가 이 명세로 reference 양식을 채운 분야별 파일을 만든다. 난수 없음 — 같은 명세면 같은 파일.
# cases: 심어 둔 사례 태그 (tests/golden/expected.yaml 과 대응). 엑셀에는 쓰지 않는다.
#
# 키 → 양식 헤더: synth.py 의 USAGE_COLUMNS / IO_COLUMNS 참고. 비운 키는 defaults 값, defaults 에도 없으면 빈칸.
# 셀 타입을 일부러 섞었다 (D5): version 2024 (정수), 5.1 (실수 — 응답자가 '5.10' 을 쳤을 때 엑셀이 바꾼 값),
# expiry 날짜 객체, users '약 6명' (문자열).

version: 1
template: reference/SW조사양식_EnGenius_v1.0.xlsx
file_name: "SW조사_{field}_20260924.xlsx"   # 작성안내 B26 규칙: SW조사_[부서]_[YYYYMMDD].xlsx
extra_categories: [설계-2D Layout]           # 사내 배포본처럼 '온톨로지분류' 선택지에 추가 (P22)

defaults:
  usage:
    purpose: 해석
    detail: 합성 데이터
    phase: 기본~상세
    task: 합성 데이터 — 실제 업무 아님
    users: 3
    freq: 주 1회 이상
    license: 영구
    qty: 1
    env: Windows PC
    airgap: 가능
    op: GUI+CLI
    batch: 가능
    auto_if: 내장 스크립팅
    headless: 모름
    auth: 없음
    storage: 공유폴더
    vv: 해당없음
    cert: 아니오
    wish: 합성 데이터
    prio: 중
  io:
    std: 모름
    nature: 수치·표
    transfer: 파일 저장
    grade: L2

files:

  # ------------------------------------------------------------------ 성능
  - field: 성능
    usages:
      - {sw_id: PERF-01, name: 가상-성능덱, version: v2.3, vendor: 자체개발, kind: 자체개발, detail: 엔진 성능 사이클 해석,
         phase: 전 단계, users: 8, freq: 매일, qty: 10, op: CLI 지원, auto_if: CLI 인자, headless: 가능, vv: 완료, cert: 예,
         prio: 상, cases: [P1]}
      - {sw_id: PERF-02, name: MATLAB, version: R2023a, vendor: MathWorks, kind: 상용, detail: 성능 시험 데이터 후처리,
         users: 4, license: 플로팅(동시사용), qty: 5, expiry: "2027-06", cases: [P7]}
      - {sw_id: PERF-03, name: Excel, version: "2019", vendor: Microsoft, kind: 상용, purpose: 문서·협업, detail: 성능 결과 정리,
         users: 10, freq: 매일, license: 연간 구독, qty: 20, expiry: 2027-03-31, op: GUI 전용, auto_if: COM·OLE, prio: 하,
         cases: [P7, D5-date]}
      - {sw_id: PERF-04, name: Python, version: "3.10", vendor: Python Software Foundation, kind: 오픈소스,
         detail: 성능 요약 자동화 스크립트, license: 무료, op: CLI 지원, auto_if: SDK·라이브러리}
    ios:
      - {sw_id: PERF-01, dir: out, name: 성능 경계조건 표, cat: 해석-결과, ext: csv, std: 국제·업계 표준,
         transfer: 메일·수기 전달, partner: Excel, note: 2차유로 분야에 메일로 전달, cases: [P1]}
      - {sw_id: PERF-01, dir: out, name: 성능 요약, cat: 보고서·문서, ext: xlsx, partner: Excel, cases: [P7]}
      - {sw_id: PERF-01, dir: out, name: 성능 요약 데이터, cat: 보고서·문서, ext: json, partner: Python}
      - {blank: true, cases: [GAP]}          # 중간 빈 행 — 계속 읽어야 한다 (docs/02 5장 2)
      - {sw_id: PERF-02, dir: in, name: 시험 계측 데이터, cat: 시험-계측데이터, ext: csv, partner: LabVIEW, cases: [P7]}
      - {sw_id: PERF-02, dir: out, name: 성능 후처리 그림, cat: 보고서·문서, ext: png, nature: 이미지}
      - {sw_id: PERF-03, dir: in, name: 해석 요약 표, cat: 보고서·문서, ext: xlsx, cases: [P7]}
      - {sw_id: PERF-04, dir: in, name: 성능 요약 데이터, cat: 보고서·문서, ext: json, partner: 가상-성능덱}
      - {sw_id: PERF-04, dir: out, name: 성능 대시보드, cat: 보고서·문서, ext: html, nature: 서술형 문서}

  # ------------------------------------------------------------------ 2차유로(SAS)
  # 예시 행(4행)도 SW ID 가 SAS-01 이다 — 실제 SAS-01 행은 내용이 달라 예시로 오인되면 안 된다 (P10-c)
  - field: 2차유로(SAS)
    usages:
      - {sw_id: SAS-01, name: 가상-1D네트워크, version: "4.2", vendor: 자체개발, kind: 자체개발,
         detail: 이차유로 유량·압력 네트워크 해석, users: 6, freq: 매일, qty: 10, auto_if: CLI 인자, headless: 가능,
         vv: 완료, cert: 예, prio: 상, cases: [P1, D2, P10-c]}
      - {sw_id: SAS-02, name: Microsoft Excel, version: "2021", vendor: Microsoft, kind: 상용, detail: 경계조건 보정 상관식,
         op: GUI 전용, auto_if: COM·OLE, prio: 상, cases: [P1, P7]}
      - {sw_id: SAS-03, name: 가상-열해석, version: "3.1", vendor: 자체개발, kind: 자체개발, detail: 금속 온도장 해석,
         users: 4, op: GUI 전용, batch: 불가, auto_if: 없음, headless: 불가, prio: 상, cases: [P8, D2]}
      - {sw_id: SAS-04, name: ANSYS FLUENT, version: 2023R2, vendor: ANSYS, kind: 상용, detail: 2차유로 3D 유동 해석,
         users: 2, freq: 월 1회 이상, cases: [P5]}
    ios:
      - {sw_id: SAS-01, dir: in, name: 보정 경계조건, cat: 해석-입력데이터, ext: .xlsx, transfer: 메일·수기 전달,
         partner: Microsoft Excel, cases: [P1]}
      - {sw_id: SAS-01, dir: out, name: 유량 분배 결과, cat: 해석-결과, ext: dat, partner: 가상-열해석, cases: [D2]}
      - {sw_id: SAS-01, dir: out, name: 유량 분배 결과, cat: 해석-결과, ext: dat, transfer: 메일·수기 전달,
         partner: 가상-미조사툴, note: 외부 협력 해석용 — 메일 송부, cases: [D2, P9]}
      - {sw_id: SAS-01, dir: out, name: 유량 요약 표, cat: 보고서·문서, ext: xlsx, partner: Excel, cases: [P7]}
      - {sw_id: SAS-02, dir: in, name: 성능 경계조건, cat: 해석-결과, ext: csv, transfer: 메일·수기 전달,
         partner: 가상-성능덱, cases: [P1]}
      - {sw_id: SAS-02, dir: out, name: 보정 경계조건, cat: 해석-입력데이터, ext: 엑셀, transfer: 메일·수기 전달,
         partner: 가상-1D네트워크, cases: [P1, P6]}
      - {sw_id: SAS-02, dir: in, name: 해석 요약 표, cat: 보고서·문서, ext: xlsx, cases: [P7]}
      - {sw_id: SAS-03, dir: in, name: 유량 분배 결과, cat: 해석-결과, ext: .dat(사내), std: 사내 표준 포맷,
         partner: 가상-1D네트워크, cases: [P6, D2]}
      - {sw_id: SAS-03, dir: in, name: 벽면 온도 조건, cat: 해석-입력데이터, ext: txt, transfer: 메일·수기 전달,
         partner: ANSYS Fluent, cases: [P8]}
      - {sw_id: SAS-03, dir: out, name: 금속 온도 결과, cat: 해석-결과, ext: tres, partner: ANSYS Mechanical}
      - {sw_id: SAS-04, dir: in, name: 해석 메시, cat: 해석-입력데이터, ext: msh, partner: HyperMesh}
      - {sw_id: SAS-04, dir: out, name: 2차유로 유동장, cat: 해석-결과, ext: "cas.h5, dat.h5", partner: Tecplot, cases: [P23]}

  # ------------------------------------------------------------------ 터빈
  - field: 터빈
    usages:
      - {sw_id: TURB-01, name: CATIA V5, version: V5-6R2020, vendor: Dassault Systèmes, kind: 상용, purpose: 설계,
         detail: 터빈 블레이드 형상 설계, users: 5, freq: 매일, license: 플로팅(동시사용), qty: 8,
         airgap: 부분 가능(비고 기재), op: GUI 전용, auto_if: COM·OLE, note: 라이선스 서버 필요, cases: [P2]}
      - {sw_id: TURB-02, name: ANSYS Fluent 2024R1, version: 2024, vendor: ANSYS, kind: 상용, detail: 터빈 냉각 유동 해석,
         users: 4, cases: [P5, P8, D5-int]}
      - {sw_id: TURB-03, name: Tecplot, version: 2023 R1, vendor: Tecplot, kind: 상용, detail: 유동장 후처리,
         users: 약 6명, cases: [P3, D5-raw]}
      - {sw_id: TURB-04, name: MATLAB, version: R2022b, vendor: MathWorks, kind: 상용, detail: 터빈 시험 데이터 분석,
         users: 2, cases: [P7]}
      - {sw_id: TURB-05, name: Excel, version: "2019", vendor: Microsoft, kind: 상용, purpose: 문서·협업, detail: 결과 정리,
         users: 6, op: GUI 전용, auto_if: COM·OLE, cases: [P7]}
    ios:
      - {sw_id: TURB-01, dir: out, name: 터빈 블레이드 3D 모델, cat: 설계-3D형상, ext: catpart, std: SW 전용(바이너리),
         nature: 3D·2D 형상, partner: ANSYS Mechanical, cases: [P2]}
      - {sw_id: TURB-02, dir: in, name: 해석 메시, cat: 해석-입력데이터, ext: msh, partner: HyperMesh}
      - {sw_id: TURB-02, dir: out, name: 벽면 온도 조건, cat: 해석-입력데이터, ext: txt, transfer: 메일·수기 전달,
         partner: 가상-열해석, cases: [P8]}
      - {sw_id: TURB-02, dir: out, name: 터빈 유동장, cat: 해석-결과, ext: "cas.h5, dat.h5", partner: Tecplot, cases: [P23]}
      - {sw_id: TURB-03, dir: in, name: 유동장 결과, cat: 해석-결과, ext: "cas.h5, dat.h5", partner: ANSYS Fluent}
      - {sw_id: TURB-03, dir: in, name: 외부 유동장, cat: 해석-결과, ext: plt, cases: [P3]}
      - {sw_id: TURB-3, dir: in, name: 냉각 공기 조건, cat: 해석-입력데이터, ext: csv, transfer: 메일·수기 전달,
         cases: [P18]}                       # SW ID 오타 — SW기본정보에 없는 고아 입출력
      - {sw_id: TURB-04, dir: in, name: 시험 계측 데이터, cat: 시험-계측데이터, ext: csv, partner: LabVIEW, cases: [P7]}
      - {sw_id: TURB-05, dir: in, name: 해석 요약 표, cat: 보고서·문서, ext: xlsx, cases: [P7]}

  # ------------------------------------------------------------------ 압축기 (SW ID 가 연소기와 같은 COM-xx — D3)
  - field: 압축기
    usages:
      - {sw_id: COM-01, name: 가상-공력설계툴, version: "1.8", vendor: 자체개발, kind: 자체개발, purpose: 설계,
         detail: 압축기 익형 공력 설계, phase: 개념~기본, op: CLI 지원, auto_if: CLI 인자, cases: [D3, P6, P22]}
      - {sw_id: COM-02, name: STAR-CCM+, version: 2210, vendor: Siemens, kind: 상용, detail: 압축기 유동 해석,
         users: 5, freq: 매일, cases: [D3, P3]}
      - {sw_id: COM-03, name: Excel, version: "2016", vendor: Microsoft, kind: 상용, purpose: 문서·협업, detail: 결과 정리,
         users: 4, op: GUI 전용, auto_if: COM·OLE, cases: [D3, P7]}
    ios:
      - {sw_id: COM-01, dir: out, name: 익형 형상, cat: 해석-입력데이터, ext: .STEP, std: 국제·업계 표준,
         nature: 3D·2D 형상, partner: HyperMesh, cases: [P6]}
      - {sw_id: COM-01, dir: out, name: 유로 2D 레이아웃, cat: 설계-2D Layout, ext: dwg, nature: 3D·2D 형상, cases: [P22]}
      - {sw_id: COM-01, dir: out, name: 설계 요약 표, cat: 보고서·문서, ext: xlsx, partner: Excel, cases: [P7]}
      - {sw_id: COM-02, dir: out, name: 압축기 유동장, cat: 해석-결과, ext: plt, cases: [P3]}
      - {sw_id: COM-02, dir: out, name: 압축기 요약 표, cat: 보고서·문서, ext: xlsx, partner: Excel, cases: [P7]}
      - {sw_id: COM-03, dir: in, name: 해석 요약 표, cat: 보고서·문서, ext: xlsx, cases: [P7]}

  # ------------------------------------------------------------------ 연소기
  - field: 연소기
    usages:
      - {sw_id: COM-01, name: 가상-연소해석기, version: "2.0", vendor: 자체개발, kind: 자체개발, detail: 연소기 연소 해석,
         auto_if: 파일 폴링, cases: [D3, P4-unlinked, P24]}
      - {sw_id: COM-02, name: Fluent, version: 2022R2, vendor: ANSYS, kind: 상용, detail: 연소실 냉각 유동 해석,
         users: 2, cases: [D3, P5]}
      - {sw_id: COM-03, name: MATLAB, version: R2021a, vendor: MathWorks, kind: 상용, detail: 연소 시험 데이터 분석,
         users: 2, cases: [D3, P7]}
      - {sw_id: COM-04, name: 가상-연소계측기, version: "1.0", vendor: 자체개발, kind: 자체개발, purpose: 시험·계측,
         detail: 연소 시험 계측, op: GUI 전용, auto_if: 파일 폴링}
    ios:
      - {sw_id: COM-01, dir: in, name: 연소 조건, cat: 해석-입력데이터, ext: cmb(사내), std: 사내 표준 포맷,
         cases: [P4-unlinked, P6]}
      - {sw_id: COM-01, dir: out, name: 연소 결과, cat: 해석-결과, ext: cmbres, cases: [P4-unlinked, P24]}
      - {sw_id: COM-01, dir: out, name: 연소 결과, cat: 해석-결과, ext: cmbres, cases: [P24]}   # 완전 중복 행
      - {sw_id: COM-02, dir: in, name: 해석 메시, cat: 해석-입력데이터, ext: msh, partner: HyperMesh}
      - {sw_id: COM-02, dir: out, name: 연소실 유동장, cat: 해석-결과, ext: "cas.h5, dat.h5", partner: Tecplot, cases: [P23]}
      - {sw_id: COM-03, dir: in, name: 연소 계측 데이터, cat: 시험-계측데이터, ext: csv, partner: 가상-연소계측기, cases: [P7]}
      - {sw_id: COM-04, dir: out, name: 연소 계측 데이터, cat: 시험-계측데이터, ext: csv, partner: MATLAB, cases: [P7]}

  # ------------------------------------------------------------------ 구조
  - field: 구조
    usages:
      - {sw_id: STR-01, name: HyperMesh, version: 5.1, vendor: Altair, kind: 상용, detail: 해석 메시 생성, users: 5,
         freq: 매일, auto_detail: TCL 스크립트, cases: [P6, D5-float]}
      - {sw_id: STR-02, name: ANSYS Mechanical, version: 2024R1, vendor: ANSYS, kind: 상용, detail: 블레이드 구조 해석,
         users: 6, cases: [P2]}
      - {sw_id: STR-03, name: NASTRAN, version: "2023.1", vendor: MSC Software, kind: 상용, detail: 디스크 구조 해석,
         op: CLI 지원, auto_if: CLI 인자, cases: [P12]}
      - {sw_id: STR-03, name: Abaqus, version: "2023", vendor: Dassault Systèmes, kind: 상용, detail: 비선형 구조 해석,
         cases: [P19]}                       # 같은 파일 안 SW ID 중복 — 경고 후 먼저 나온 행 사용
      - {sw_id: STR-04, name: 가상-수명평가툴, version: "1.2", vendor: 가상-수명평가사, kind: 상용, detail: 저주기 피로 수명 평가,
         users: 2, freq: 월 1회 이상, env: 외부 클라우드(SaaS), airgap: 불가, op: CLI 지원, auto_if: REST API,
         auth: 자체 계정, prio: 상, cases: [P12]}
      - {sw_id: STR-05, name: Excel, version: "2019", vendor: Microsoft, kind: 상용, purpose: 문서·협업, detail: 결과 정리,
         field_cell: 시험, op: GUI 전용, auto_if: COM·OLE, cases: [P7, P17]}   # 파일은 구조인데 담당 부서는 시험
    ios:
      - {sw_id: STR-01, dir: in, name: 익형 형상, cat: 해석-입력데이터, ext: "*.stp", partner: 가상-공력설계툴, cases: [P6]}
      - {sw_id: STR-01, dir: out, name: 해석 메시, cat: 해석-입력데이터, ext: msh, partner: ANSYS Fluent}
      - {sw_id: STR-01, dir: out, name: 구조 메시, cat: 해석-입력데이터, ext: bdf, partner: NASTRAN}
      - {sw_id: STR-02, dir: in, name: 블레이드 형상, cat: 설계-3D형상, ext: stp, nature: 3D·2D 형상, partner: CATIA,
         cases: [P2]}
      - {sw_id: STR-02, dir: in, name: 금속 온도 결과, cat: 해석-결과, ext: tres, partner: 가상-열해석}
      - {sw_id: STR-02, dir: out, name: 구조 요약 표, cat: 보고서·문서, ext: xlsx, partner: Excel, cases: [P7]}
      - {sw_id: STR-03, dir: in, name: 구조 메시, cat: 해석-입력데이터, ext: bdf, partner: HyperMesh}
