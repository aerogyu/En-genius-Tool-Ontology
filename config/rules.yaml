# 적재·도출 규칙 값 (docs/02 9장). 실제 사내 양식의 값이 다르면 여기만 고친다 — 코드에 박지 않는다.
# 세부 해석의 정본은 tests/golden/expected.yaml interpretations (I번호).
rule_version: feed_v1

# --- 적재 (docs/02 5장) ---------------------------------------------------------
loader:
  file_pattern: "*.xlsx"
  # 파일명 규칙 (I31; 양식 v1.0 작성안내 B26 'SW조사_', v1.1 B27 'Tool조사_' — 둘 다 허용) — field·date 이름 그룹 필수.
  # 맞지 않으면 경고 후 분야 미상으로 적재. 정식 규칙: Tool조사_<부서>_<YYYYMMDD>.xlsx (Leo 확정 2026-09-28, docs/02 5-1)
  file_name_regex: '^(?:SW|Tool)조사_(?P<field>[^_]+)_(?P<date>\d{8})\.xlsx$'
  header_row: 2               # 1행 섹션 밴드, 2행 헤더
  data_start_row: 4           # 3행 작성 안내(회색), 4행부터 예시·응답 — 예시는 내용으로 판별 (I15)
  blank_rows_end: 10          # 연속 빈 행이 이만큼이면 시트 끝으로 본다. 그 뒤 내용 행은 적재하지 않고 제외 행으로 남긴다 (docs/09 #6)
  # 실제 파일의 시트 이름 후보 (앞에서부터 찾고, 없으면 공백·'*' 무시 비교). 양식 v1.1 이름을 앞에 (docs/09 #13, M3.1)
  sheets:
    usage: [Tool 기본정보, SW기본정보]
    io: [Tool 입출력, SW입출력]
  choices_sheet: [선택지(수정금지), 선택지]    # 2행 목록 이름, 3행부터 값 (I28 — 파일마다 따로 읽는다)
  # 선택지 목록 이름이 양식판마다 다를 때: 스키마 목록 이름 → 실제 파일 목록 이름 후보
  choice_list_aliases: {사용단계: [사용 기간]}
  # 드롭다운 목록에는 없지만 양식 안내가 허용한 값 — 선택지 밖 경고를 내지 않는다
  # (v1.1 작성안내: '담당 부서' 는 "목록에 없으면 '기타' 후 비고", Leo 2026-09-28 — 실제 파일 다수가 '기타')
  extra_choice_values: {담당부서: [기타]}
  # 양식판에 따라 없어도 되는 열 — 없으면 '양식 열 없음' 경고도, 필수값 누락도 내지 않는다
  absent_ok_slots: [essential_tool, airgap_ok, priority_opinion]

# 인명 유사 패턴 경고 (D6, I29, docs/09 #20) — 값은 보존하고 경고만 (경고 문구에 값을 옮기지 않는다).
# person_pattern 은 자유 텍스트 열(free_text_slots)에, person_patterns_all 은 적재하는 모든 문자열 열에 적용한다.
person_pattern: '(책임|선임|수석|연구원|과장|차장|부장|대리|사원|팀장)\s*\(\s*내선'
person_patterns_all:
  - '(책임|선임|수석|연구원|과장|차장|부장|대리|사원|팀장|파트장|그룹장|센터장)\s*님'
  - '[가-힣]{2,4}\s*(책임|선임|수석|과장|차장|부장|대리|팀장|파트장|그룹장)(님|\b|\s|$)'
  - '내선\s*[:：]?\s*\d{3,5}'
  - '01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}'
free_text_slots: [purpose_detail, task_summary, automation_detail, automation_wish, pain_points, roadmap_note, note]

# --- 정규화 (docs/02 6장) --------------------------------------------------------
empty_tokens: ["", "없음", "모름", "-", "—", "–", "n/a", "na", "해당없음", "해당 없음"]   # I16, 소문자 비교
# 버전 토큰 (I2) — 툴 정규화 키에서 버린다
version_token_regex: '^(v\d+(\.\d+)*|\d{4}r\d+|r\d+[a-z]?|sp\d+|\d+(\.\d+)+|(19|20)\d{2})$'   # 연도만 있는 토큰도 버전 (docs/09 #16 A, 2026-10-01)
# 연계 SW명 구분자 (I17). 'ㆍ'(U+318D) 는 NFKC 에서 U+119E 로 바뀌므로 둘 다 둔다
partner_separators: ",;/·ㆍᆞ・\n"
# 툴 이름 토큰 치환 (docs/09 #16 A, 2026-10-02) — 영숫자만 남기면 C++·C#·C 가 모두 'c' 로 합쳐지므로 공백 토큰 단위로 먼저 바꾼다 (소문자 비교)
tool_token_map: {"c++": cpp, "c#": csharp, "f#": fsharp}
# 범용 툴 이름 (Leo 결정 Q3(b), 2026-10-02 — docs/11 8장): 이런 이름(정규화 키 기준)이나 빈 키는 통합하지 않고 행마다 별개 툴
# '미상:<파트>/<Tool ID>' 로 두며, 수정 요청표에 '툴 이름을 지어 주세요' 행을 싣는다. 연계 Tool명에 적힌 것은 빈 값처럼 버린다 (I16·I34)
# 제조사 칸에 이런 이름이 적혀 있으면 **제조사 접두로 쓰지 않는다** — 같은 행에서 떼지도, 다른 행의 접두 흡수(I1)·연계 Tool명 해석에도
# 쓰지 않는다 (자체개발 툴을 자동 통합하지 않기 위해, Leo Q3(b)). 예: '자체개발 유량계산기'/제조사 자체개발 → 키 '자체개발유량계산기'
generic_tool_names: [자체개발, 자체 개발, 자체제작, 자체 제작, 사내툴, 사내 툴, 사내개발, 사내 개발, 인하우스, in-house, inhouse, custom, 매크로, macro]
# 통합 후보의 '포함' 판정은 짧은 쪽 키가 이 길이 이상일 때만 (docs/09 #16 A — 'c' 같은 한두 글자 키가 모든 키에 포함되는 것을 막는다)
candidate_min_contain_len: 3

# --- 도출 (docs/02 7장, M4) -------------------------------------------------------
direction: {consume: ["입력(소비)"], produce: ["출력(생산)"]}
manual_transfer_values: ["메일·수기 전달"]
manual_note_keywords: ["수기", "수작업", "손으로", "복사", "재입력"]
automatable:
  operation_modes: ["CLI 지원", "GUI+CLI"]
  non_automation_if: ["없음", "모름"]
airgap_excluded: ["불가"]   # 폐지 결정 (Leo 2026-09-29, docs/02 7.4) — M4 에서 [] 로 바꾸고 골든 재등급을 한 커밋에 (지금은 골든이 이 값을 쓴다)
generic_extensions: [xlsx, xls, csv, txt, pdf, docx, pptx, hwp]
frequency_rank: {"매일": 4, "주 1회 이상": 3, "월 1회 이상": 2, "분기 이하": 1}
priority_rank: {"상": 3, "중": 2, "하": 1}
hub_top_n: 10
fuzzy_threshold: 0.85
