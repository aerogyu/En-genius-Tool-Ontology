# 조직 단위 = 응답 단위(담당자 1명 = 파일 1개 = FLD 1개) — docs/10. Leo 승인 2026-09-28. M3.1 묶음 T 에서 적재기가 읽는다 (지금은 아무 코드도 읽지 않는다).
# 약칭은 파일명 Tool조사_<약칭>_<YYYYMMDD>.xlsx 와 Tool ID 접두어(<약칭>-01)에 쓰인다. FLD ID 는 레지스트리가 발급하는 무의미 번호.
#   name:    FLD 라벨 (Leo 기입, docs/10 2장)
#   parts:   이 응답 단위가 묶어 낸 파트들 (뒤에 분할하면 succeeds 로 잇는다)
#   domains: 이 단위의 행에 나오는 '담당 부서' 값 — 실제 파일은 드롭다운 10개 중 하나이거나, 목록에 없는 파트는 '기타' 라고 적었다 (Leo 2026-09-28).
#            데이터는 고치지 않는다. 행 값이 여기 없으면 경고만. 보고서·연결 지도의 '부서 묶음' 은 행 값이 아니라 이 목록의 첫 값을 쓴다.
#   status:  확정 | 미정(약칭 없음) | 분할예정 | 폐기      succeeds: 분할·통합 전 약칭 (상위 스키마 §9 승계)
domain_values: [체계, 성능, 압축기, 터빈, 연소기, "2차유로(SAS)", 구조, 제어, 시험, 인증, 기타]   # 드롭다운 10 + '기타'(목록 밖 응답 허용)

parts:
  PL:   {name: "PMO1·PMO2 파트", parts: [PMO1, PMO2], domains: [기타], status: 확정}
  TEST: {name: "시험 파트", parts: [시험], domains: [시험], status: 확정}
  PRF:  {name: "성능 파트", parts: [성능], domains: [성능], status: 확정}
  CMP:  {name: "팬/압축기 파트", parts: [팬/압축기], domains: [압축기], status: 확정}
  COMB: {name: "연소기 파트", parts: [연소기], domains: [연소기], status: 확정}
  TA:   {name: "터빈공력 파트", parts: [터빈공력], domains: [터빈], status: 확정}
  CL:   {name: "고정체 냉각·회전체 냉각 파트", parts: [고정체 냉각, 회전체 냉각], domains: [기타], status: 확정}
  SAS:  {name: "2차유로 파트", parts: [2차유로], domains: ["2차유로(SAS)"], status: 확정}
  CD:   {name: "터빈 형상설계·압축기 형상설계 파트", parts: [터빈 형상설계, 압축기 형상설계], domains: [터빈, 압축기], status: 분할됨,
         file_split_by_id_prefix: [MDT, MDC]}   # 2026-09-30: 파일은 하나, 시트 안 Tool ID 가 MDT-n·MDC-n 으로 나뉨 (Leo)
  MDT:  {name: "터빈 형상설계 파트", parts: [터빈 형상설계], domains: [터빈], status: 확정, succeeds: [CD]}
  MDC:  {name: "압축기 형상설계 파트", parts: [압축기 형상설계], domains: [압축기], status: 확정, succeeds: [CD]}   # 담당자 2명 (Leo 2026-09-30)
        # 분할 요청 예정 → 예: CDT·CDC1·CDC2. 분할 파일이 오면 CD 는 폐기, 새 항목에 succeeds: [CD]. domains 는 추정 — Leo 확인
  IPS:  {name: "RAMS-C·엔진IPS요소개발·항공시스템IPS요소개발 파트", parts: [RAMS-C, 엔진IPS요소개발, 항공시스템IPS요소개발], domains: [기타], status: 확정}
  RSP:  {name: "형상관리·RSP·열전달 파트", parts: [형상관리, RSP, 열전달], domains: [기타], status: 확정}
  FEM:  {name: "", parts: [], domains: [], status: 확정}     # 담당자 2명을 한 단위로 (Leo 2026-09-30 — 에이전트 개발은 담당자별로 나눠 맡김). 정식 이름·담당 부서 값 미기입
  FS:   {name: "유도무기·항공연료1·항공연료2 파트", parts: [유도무기, 항공연료1, 항공연료2], domains: [기타], status: 확정}
  RE:   {name: "착륙유압·왕복엔진 파트", parts: [착륙유압, 왕복엔진], domains: [기타], status: 확정}
  EC:   {name: "구동제어·제어계측·전원공급시스템 파트", parts: [구동제어, 제어계측, 전원공급시스템], domains: [기타], status: 확정}
  ACT:  {name: "구동계통 파트", parts: [구동계통], domains: [기타], status: 확정}
  MAT:  {name: "주조·단조·MC·PL 파트", parts: [주조, 단조, MC, PL], domains: [기타], status: 확정}
  PE:   {name: "특수공정·AM 파트", parts: [특수공정, AM], domains: [기타], status: 확정}
  # 약칭 미정 2개 — 약칭이 오면 키를 바꾼다 (임시 코드로 적재했다면 field_renames.yaml, docs/09 #25b)
  전기전자제어:      {name: "전기·전자·제어 파트", parts: [전기, 전자, 제어], domains: [제어, 기타], status: 미정}
  GBLB: {name: "연료·윤활·기어박스 파트", parts: [연료, 윤활, 기어박스], domains: [제어], status: 확정}   # 약칭 회신 2026-09-30

# 합성 데이터(data/synthetic)용 — 파일명 분야 = 담당 부서 값 체계. M3.1 T 에서 골든 값을 유지하려고 둔다.
synthetic_parts_are_domains: true
