# 양식 헤더 → 스키마 슬롯 매핑의 '추가 문구' (docs/02 9장).
# 기본 문구는 스키마(schema/engenius_tool.yaml 의 form_header 주석)에 있고, 적재기는 그것을 먼저 쓴다.
# 사내 배포 양식의 헤더 문구가 다르면 여기에 '슬롯 이름: [문구, ...]' 로 덧붙인다 — 코드는 고치지 않는다.
# 비교는 NFKC 후 공백과 '*' 를 무시한다 (골든 I30) — '사용빈도'·'파일형식/확장자＊' 같은 변형은 적을 필요가 없다.
# 시트 이름은 원본 양식(v1.0) 이름으로 쓴다 — 실제 파일의 시트 이름(v1.1 'Tool 기본정보' 등)은 rules.yaml loader.sheets 가 맞춘다.
SW기본정보:
  # 양식 v1.1 (reference/양식_v1.1_변경분.md 2장, 2026-09-28)
  source_key: ["Tool ID"]
  reported_tool_name: ["Tool명(정식)"]
  phase: ["사용 기간"]
SW입출력:
  owner_source_key: ["Tool ID"]
  partner_raw: ["연계 Tool명"]
